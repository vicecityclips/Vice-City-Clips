# ==============================================================================
# WORKFLOW PART 1: TRIGGERS, CONCURRENCY & ENVIRONMENT SETUP
# File: .github/workflows/clipper.yml
# ==============================================================================
name: ViceCityClips Hourly Auto-Clipper

on:
  schedule:
    - cron: "15 * * * *" # Runs every hour at :15 past the hour
  workflow_dispatch:
    inputs:
      force_upload:
        description: "Override upload_to_youtube? (leave blank to use main.py config)"
        required: false
        default: ""

permissions:
  contents: write # Needed to commit updated history.json cleanly

concurrency:
  group: vicecity-clipper-hourly
  cancel-in-progress: false

jobs:
  clip-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1.1 Checkout Repository
        uses: actions/checkout@v4

      - name: 1.2 Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ==============================================================================
      # WORKFLOW PART 2: SYSTEM TOOLS, MODEL CACHE & PYTHON DEPENDENCIES
      # ==============================================================================
      - name: 2.1 Install System FFmpeg & Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: 2.1b Set Up Deno JS Runtime (For yt-dlp YouTube Solver)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 2.2 Cache OpenCLIP & Faster-Whisper Models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/clip
          key: ${{ runner.os }}-vicecity-models-v1
          restore-keys: |
            ${{ runner.os }}-vicecity-models-

      - name: 2.3 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==============================================================================
      # WORKFLOW PART 3: RUN CLIPPER, UPLOAD ARTIFACTS & SAVE HISTORY
      # ==============================================================================
      - name: 3.1 Run Auto-Clipper 
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
          FORCE_UPLOAD_OVERRIDE: ${{ github.event.inputs.force_upload }}

        run: |
          python main.py

      - name: 3.2 Save Rendered Shorts to Artifacts (For Private/Local Preview)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-shorts-${{ github.run_number }}
          path: |
            final_short_*.mp4
            thumb_*.jpg
          if-no-files-found: ignore
          retention-days: 3

      - name: 3.3 Commit Updated history.json
        if: always()
        run: |
          if [ -f history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@://github.com"
            git add history.json
            if ! git diff --staged --quiet; then
              git pull --rebase origin main || true
              git commit -m "chore: update clipper history [skip ci]"
              git push
            fi
          fi
