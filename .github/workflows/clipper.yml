name: Vice City Clips - 4x Daily GTA 6 Auto Clipper

on:
  workflow_dispatch:
  schedule:
    # 4 Peak Global Gaming Windows (00:00, 06:00, 12:00, 18:00 UTC)
    # IST Equivalent: 5:30 AM, 11:30 AM, 5:30 PM, 11:30 PM
    - cron: '0 0,6,12,18 * * *'

jobs:
  clip-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          pip install -U yt-dlp
          pip install -r requirements.txt

      - name: Find GTA 6 Live Stream, Edit Viral Short & Auto-Upload
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u main.py

      - name: Save clipped stream history
        if: always()
        run: |
          if [ -f history.json ]; then
            git config user.name "ViceCityClipsBot"
            git config user.email "actions@github.com"
            git add history.json || true
            git commit -m "Log clipped stream timestamp" || true
            git push || true
          fi
