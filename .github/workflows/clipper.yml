# ==============================================================================
# GITHUB ACTIONS WORKFLOW: @Vice-City_ClipsVault 24/7 HOURLY AUTO-CLIPPER
# Stage 1 (Hours 1-5): Harvests & banks 26s GTA 6 gems into clip_vault/
# Stage 2 (T-Minus 1h): Compiles Top 1-5 distinct clips & schedules Short
# ==============================================================================
name: Vice-City Clips Vault 24/7 Auto-Clipper

on:
  schedule:
    # Runs at :30 past every hour (01:30, 02:30, 03:30... UTC) = 6 runs per 6-hour slot
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      force_upload:
        description: "Override upload_to_youtube switch (true / false / leave blank)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  clip-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1.1 Checkout Repository & Existing Clip Vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 1.2 Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 2.1 Install System FFmpeg & Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: 2.1b Set Up Deno JS Runtime (For yt-dlp YouTube Solver)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 2.2 Cache OpenCLIP & Faster-Whisper Models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/open_clip
          key: ${{ runner.os }}-ai-models-v2-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-ai-models-v2-

      - name: 2.3 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q

      - name: 3.1 Run 2-Stage GTA 6 Auto-Clipper Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          python main.py

      - name: 3.2 Save Rendered Shorts & Thumbnails to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-shorts-${{ github.run_number }}
          path: |
            final_short_*.mp4
            thumb_*.jpg
          if-no-files-found: ignore
          retention-days: 5

      - name: 3.3 Persist Vault Clips & History Back to Repository
        if: always()
        run: |
          git config user.name "ViceCityClipsBot"
          git config user.email "bot@vicecityclipsvault.local"
          mkdir -p clip_vault
          git add -A history.json clip_vault/
          if ! git diff --cached --quiet; then
            git commit -m "chore(vault): sync banked GTA 6 clips & history [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo "No changes in history.json or clip_vault/ to commit."
          fi
