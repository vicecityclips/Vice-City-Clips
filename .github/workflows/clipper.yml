name: Vice City Clips Vault - Hourly Scout & Pre-Slot Publisher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (publish or scout)"
        required: false
        default: "publish"
  schedule:
    - cron: "13 * * * *"              # Hourly Scout (saves #1 raw clip from that hour)
    - cron: "15 5,11,17,23 * * *"     # Pre-Slot Publisher (45 mins before 06:00, 12:00, 18:00, 00:00 UTC)

permissions:
  contents: write
  actions: write

jobs:
  clip-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools (FFmpeg & Streamlink)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation
          pip install --quiet streamlink numpy scipy faster-whisper google-genai google-api-python-client google-auth-oauthlib requests

      - name: Run Scout or Pre-Slot Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '15 5,11,17,23 * * *' && 'publish' || 'scout') }}
        run: python main.py

      - name: Save Hourly Candidate Clip (Auto-Expires in 1 Day)
        if: always() && hashFiles('candidate_out/candidate_raw.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vault-candidate-${{ github.run_id }}
          path: candidate_out/
          retention-days: 1

      - name: Save Rendered Short & Thumbnail Artifact
        if: always() && hashFiles('final_short.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: batch-gta6-shorts-${{ github.run_id }}
          path: |
            final_short.mp4
            final_thumb.jpg
          retention-days: 3

      - name: Commit updated history.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json || true
          git diff --staged --quiet || git commit -m "chore: update schedule history"
          git push || true
