name: Vice City Clips - 6x Daily Auto Live Clipper

on:
  workflow_dispatch:
  schedule:
    # 6 Peak Global Gaming Windows (12:00, 15:00, 18:00, 21:00, 00:00, 03:00 UTC)
    # IST Equivalent: 5:30 PM, 8:30 PM, 11:30 PM, 2:30 AM, 5:30 AM, 8:30 AM
    - cron: '0 0,3,12,15,18,21 * * *'

jobs:
  clip-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages & Node PO Token Server
        run: |
          pip install -U yt-dlp bgutil-ytdlp-pot-provider
          pip install -r requirements.txt
          git clone --single-branch --branch 1.2.2 https://github.com /tmp/pot
          cd /tmp/pot/server && npm install && npx tsc
          nohup node /tmp/pot/server/build/main.js > /tmp/pot.log 2>&1 &
          sleep 4

      - name: Decode YouTube cookies
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -n "$YOUTUBE_COOKIES_B64" ]; then
            echo "$YOUTUBE_COOKIES_B64" | base64 --decode > cookies.txt
            echo "Cookies decoded successfully!"
          fi


      - name: Find Live Stream, Edit Viral Short & Auto-Upload
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u main.py

      - name: Save clipped stream history
        if: always()
        run: |
          if [ -f history.json ]; then
            git config user.name "ViceCityClipsBot"
            git config user.email "bot@://github.com"
            git add history.json || true
            git commit -m "Log clipped stream timestamp" || true
            git push || true
          fi
