name: Vice City Clips Vault - 6-Stream Batch Auto Clipper

on:
  workflow_dispatch:
  schedule:
    # Runs 4 times daily to refill upcoming 6-hour scheduled slots (00:00, 06:00, 12:00, 18:00 UTC)
    # IST Equivalent: 5:30 AM, 11:30 AM, 5:30 PM, 11:30 PM
    # If all 4 slots in the next 24h are already scheduled, main.py exits in 2 seconds!
    - cron: '0 0,6,12,18 * * *'

jobs:
  batch-clip-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          pip install -U yt-dlp
          pip install -r requirements.txt

      - name: Batch Record 6 GTA 6 Streams, Render Top Shorts & Schedule
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u main.py

      - name: Save Rendered Shorts & Thumbnails for Download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-gta6-shorts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 2

      - name: Save scheduled slots & stream history
        if: always()
        run: |
          if [ -f history.json ]; then
            git config user.name "ViceCityClipsBot"
            git config user.email "actions@github.com"
            git add history.json || true
            git commit -m "Update scheduled slots & stream history" || true
            git push || true
          fi
