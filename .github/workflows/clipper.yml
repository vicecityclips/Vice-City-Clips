name: Vice City Clips Vault - Hourly Scout & Single-Slot Publisher

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: auto, scout, or publish'
        required: false
        default: 'auto'

permissions:
  contents: write

jobs:
  clip-and-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -U "yt-dlp[default]" curl_cffi streamlink requests google-genai faster-whisper edge-tts gTTS google-api-python-client google-auth

      - name: Run Scout or Single-Slot Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MODE: ${{ github.event.inputs.mode != '' && github.event.inputs.mode || 'auto' }}
        run: python main.py

      - name: Save Hourly Candidate Clip
        if: always() && hashFiles('candidate_pool/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vault-candidate-${{ github.run_id }}
          path: candidate_pool/
          retention-days: 1

      - name: Save Rendered Short & Thumbnail Artifact
        if: always() && hashFiles('artifacts/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: batch-gta6-shorts-${{ github.run_id }}
          path: artifacts/
          retention-days: 3

      - name: Commit Updated History
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update schedule history"
          file_pattern: "history.json"
