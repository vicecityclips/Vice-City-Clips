name: Vice-City Clips Vault 24/7 Auto-Clipper

on:
  schedule:
    # Runs every hour on the hour (24/7 harvest + 6-hour IST publish windows)
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force_upload:
        description: "Force build/upload immediately outside 6-hour window (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: vice-city-clips-vault-pipeline
  cancel-in-progress: false

jobs:
  harvest-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg & Deno Runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          curl -fsSL https://deno.land | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U yt-dlp google-genai faster-whisper edge-tts opencv-python-headless numpy pillow google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run 2-Stage GTA 6 Auto-Clipper Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
          FORCE_UPLOAD: ${{ github.event.inputs.force_upload || 'false' }}
        run: |
          python main.py

      - name: Upload Rendered Short & Thumbnail Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vice-city-short-preview-${{ github.run_number }}
          path: |
            final_short_*.mp4
            thumb_*.jpg
          if-no-files-found: ignore
          retention-days: 5

      - name: Commit & Push Vault State
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          mkdir -p clip_vault
          git add history.json clip_vault/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update clip vault and history state [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to history.json or clip_vault/."
          fi
