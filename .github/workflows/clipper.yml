name: Vice City Clips Vault - Hourly Scout & Single-Slot Publisher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (scout or publish)"
        required: false
        default: "scout"
  schedule:
    - cron: "13 * * * *"              # Hourly Scout (builds 5-clip pool across each 6h window)
    - cron: "0 5,11,17,23 * * *"      # Single-Slot Publisher (60m before 06:00, 12:00, 18:00, 00:00 UTC)

permissions:
  contents: write
  actions: write

jobs:
  clip-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (with Pip Cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ".github/workflows/clipper.yml"

      - name: Install system tools (FFmpeg, Streamlink & yt-dlp)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-liberation
          pip install --quiet -U yt-dlp streamlink numpy scipy opencv-python-headless faster-whisper google-genai google-api-python-client google-auth-oauthlib requests

      - name: Run Scout or Single-Slot Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MODE: ${{ github.event.inputs.mode != '' && github.event.inputs.mode || (github.event.schedule == '0 5,11,17,23 * * *' && 'publish' || 'scout') }}
        run: python main.py

      - name: Save Hourly Candidate Clip (Auto-Expires in 1 Day)
        if: always() && hashFiles('candidate_out/candidate_meta.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vault-candidate-${{ github.run_id }}
          path: candidate_out/
          retention-days: 1

      - name: Save Rendered Short & Thumbnail Artifact
        if: always() && hashFiles('final_short.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: batch-gta6-shorts-${{ github.run_id }}
          path: |
            final_short.mp4
            final_thumb.jpg
          retention-days: 3

      - name: Commit Updated History
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update schedule history"
          file_pattern: "history.json"
